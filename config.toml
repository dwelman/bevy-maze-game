[player]
# Speed of lerping from current position to next position (units per second)
lerp_speed = 10.0

# Speed of lerping rotation (radians per second)
rotation_lerp_speed = 3.0

# Delay in seconds before repeating movement input when button is held
input_repeat_delay = 0.15

# Height above the creature's feet where the camera (eyes) sit, in world units.
eye_height = 1.55

[camera]
# Look mode: "relative" (follows mouse movement) or "absolute" (looks at cursor position)
look_mode = "relative"

# Mouse sensitivity for looking (pixels per degree) - used in relative mode
mouse_sensitivity = 0.15

# Maximum horizontal look angle in degrees (left/right)
max_look_horizontal = 80.0

# Maximum upward look angle in degrees
max_look_up = 90.0

# Maximum downward look angle in degrees
max_look_down = 45.0

# Speed of lerping look back to forward (radians per second)
look_lerp_speed = 8.0

[controls]
# Use W/A/S/D, Q/E, Tab, M, Arrow keys, or PageUp/PageDown
move_forward = "W"
move_backward = "S"
move_left = "A"
move_right = "D"
rotate_left = "Q"
rotate_right = "E"
look_hold = "Tab"
look_mode_toggle = "M"

[movement]
# Input polling frequency - how often to check for player input (affects responsiveness)
# This is just a reference value; actual movement happens in the Update system
input_poll_rate = 60

[debug]
# Log level: "off", "error", "warn", "info", "debug", or "trace"
# Set to "debug" to see detailed movement/collision logging
log_level = "debug"

[world]
# Size of each cell in world units
cell_size = 3.0
